[project]
name = "cs-image-system-gcs-state-plugin"
version = "0.2.1"
description = "The GCS state backend plugin: a Google Cloud Storage bucket for every terraform root that names it"
readme = "README.md"
authors = [{ name = "Mykel Alvis", email = "mykelalvis@infrastructurebuilder.org" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cs-image-system-contract>=0.5,<0.7",   # 0.6 adds only members the family does not use (cs-image-system-3 spec 010)
    # The SDK, by range: this package works with any release of the kit's 0.2 line and of the terraform
    # libraries' 0.2 line (a release there adds; a removal or alteration of their surface starts 0.3).
    "cs-image-system-base>=0.2,<0.3",
    "pydantic>=2.13",
]

# what this package's own tests need beyond its dependencies
[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "cs-image-system-hashicorp-utils>=0.2,<0.3",      # the collector its collision test drives
    "cs-image-system-local-state-plugin>=0.1.11,<0.2",  # the core backend that test sets beside gcs
]

[project.urls]
Repository = "https://github.com/infrastructurebuilder/cs-image-system-google-cloud"
Documentation = "https://github.com/infrastructurebuilder/cs-image-system-3/blob/develop/docs/OPERATIONS.md"
"Package README" = "https://github.com/infrastructurebuilder/cs-image-system-google-cloud/blob/develop/packages/gcs-state-plugin/README.md"

[project.entry-points."cs_image_system.plugins.state"]
gcs_state_plugin = "cs_image_system.gcs_state_plugin.main:initialize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_image_system"]
exclude = ["*.code-workspace"]
