# The workspace of the Google Cloud provider family for cs-image-system: the
# runtime, its OpenTofu roots and its GCS state backend, three distributions
# that release together under one number (`just release`). This root is never
# built or published; an operator installs the family through the system's own
# extra, `uv tool install 'cs-image-system[gcloud]'`.
#
# Everything of the system the family needs comes from the package index, by
# range: the contract, the kit and the Terraform libraries (the packages'
# dependencies), and the command line with its test kit and the core plugins
# the family's fixture declares (the dev group below). Nothing here names a
# path into another repository.
[project]
name = "cs-image-system-google-cloud-workspace"
version = "0.2.1"
description = "The workspace of the Google Cloud provider family for cs-image-system (never published)"
requires-python = ">=3.13"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "cs-image-system-gcloud-runtime-plugin[test]",
    "cs-image-system-tf-gcp-plugin[test]",
    "cs-image-system-gcs-state-plugin[test]",
    # the pipeline suite (tests/): the command line and its test kit, and the core plugins its
    # fixture declares, from the index, by the range of the system's line
    "cs-image-system-system[testing]>=0.1.11,<0.2",
    "cs-image-system-packer-plugin>=0.1.11,<0.2",
    "cs-image-system-ansible-plugin>=0.1.11,<0.2",
    "cs-image-system-bash-mod-plugin>=0.1.11,<0.2",
    "cs-image-system-default-os-plugin>=0.1.11,<0.2",
    "cs-image-system-local-state-plugin>=0.1.11,<0.2",
    "cs-image-system-posix-identity-plugin>=0.1.11,<0.2",
    "pytest>=8.3",
    "ruff>=0.15",
    "pyright>=1.1.390",
    "reuse>=6.2.0",
    "bump-my-version>=1.2",
]

# the names of the system reached only through another (`cs-image-system-system` takes the
# engine), named here so the TestPyPI source under [tool.uv.sources] applies to them too;
# by the range of the system's line, and never installed for themselves
index-pins = [
    "cs-image-system-engine>=0.1.11,<0.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cs-image-system-gcloud-runtime-plugin = { workspace = true }
cs-image-system-tf-gcp-plugin = { workspace = true }
cs-image-system-gcs-state-plugin = { workspace = true }
# Every name of the system this workspace reaches comes from TestPyPI, where every release
# goes until 1.0 (cs-image-system-3 specification 013), and only those: every third-party
# name comes from PyPI, since TestPyPI also holds stale or foreign copies of common names
# (tests/tooling/test_index_pins.py holds the lock to it). A source applies to a direct dependency
# alone, so a name reached only through another is named in the `index-pins` group.
cs-image-system-ansible-plugin = { index = "testpypi" }
cs-image-system-base = { index = "testpypi" }
cs-image-system-bash-mod-plugin = { index = "testpypi" }
cs-image-system-contract = { index = "testpypi" }
cs-image-system-default-os-plugin = { index = "testpypi" }
cs-image-system-engine = { index = "testpypi" }
cs-image-system-hashicorp-utils = { index = "testpypi" }
cs-image-system-local-state-plugin = { index = "testpypi" }
cs-image-system-packer-plugin = { index = "testpypi" }
cs-image-system-posix-identity-plugin = { index = "testpypi" }
cs-image-system-system = { index = "testpypi" }
cs-image-system-tofu-roots = { index = "testpypi" }

# The indexes: `testpypi` serves the system's names above and takes every release
# (`uv publish --index testpypi`); `pypi` takes none until 1.0. Both are explicit, so
# neither serves a name the sources above do not give it.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

# The family's one number: the three manifests' versions, the exact pin of the
# Terraform plugin on the runtime, and this root's.
[tool.bumpversion]
current_version = "0.2.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
glob = "packages/*/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/tf-gcp-plugin/pyproject.toml"
search = '"cs-image-system-gcloud-runtime-plugin=={current_version}"'
replace = '"cs-image-system-gcloud-runtime-plugin=={new_version}"'

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", "generated", "**/generated"]
# the scripts carry no .py suffix (they are run by name), so ruff is told they are Python
extend-include = ["scripts/*"]

[tool.ruff.lint]
# the system's own rules: pyflakes, syntax errors, the complexity ceiling,
# bugbear and import sorting, every one blocking
select = ["F", "E9", "C90", "B", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["cs_image_system"]

[tool.pytest.ini_options]
# The strict session (the system's test kit): a run that collects nothing or
# skips anything fails. tests/live needs a Google Cloud session and is left out.
testpaths = [
    "packages/gcloud-runtime-plugin/tests",
    "packages/tf-gcp-plugin/tests",
    "packages/gcs-state-plugin/tests",
    "tests/pipeline",
    "tests/tooling",
]
addopts = "-p cs_image_system.system.testing.strict --import-mode=importlib"
# the pipeline tests import their harness (tests/pipeline/family.py) by name
pythonpath = ["tests/pipeline"]

[tool.pyright]
include = ["packages/**/src", "packages/**/tests", "tests"]
exclude = ["**/.venv", "**/generated"]
extraPaths = [
    "tests",
    "tests/pipeline",
    "packages/gcloud-runtime-plugin/src",
    "packages/gcs-state-plugin/src",
    "packages/tf-gcp-plugin/src",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportIncompatibleMethodOverride = "error"
