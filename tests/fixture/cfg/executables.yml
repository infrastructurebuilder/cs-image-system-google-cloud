  binary: /usr/local/bin/bash
  version: '>=5'
- name: open-tofu-1
  type: tofu
  binary: /usr/local/bin/tofu
  version: '>1,<2'
- name: yq
  version: '>=4.5'
- name: jq
  version: '>=1.7'
