---
image_builders:
- name: pckr-gce-ans
  type: packer-gce
  runtime: gcloud-east1
  executable: packer
  required_plugins:
  - name: googlecompute
    source: github.com/hashicorp/googlecompute
    version: '>= 1.0.0'
  - name: ansible
    source: github.com/hashicorp/ansible
    version: '>= 1.0.0'
  is_default: true
